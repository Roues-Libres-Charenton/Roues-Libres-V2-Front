name: Fetch Events and Push to Assets

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fetch-events-main
  cancel-in-progress: true

jobs:
  fetch-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch events and save to JSON
        run: node fetch-events.js

      - name: Commit and push events.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add src/assets/events.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update events.json"

          # 🔁 Sync with remote to avoid non-fast-forward
          git pull --rebase origin main

          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
