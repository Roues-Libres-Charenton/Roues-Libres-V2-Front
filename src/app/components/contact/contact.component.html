<div class="h-full flex flex-col items-center justify-center px-4 py-8">

        <p class="color text-sm md:text-base">

    <div class="flex flex-col gap-6 items-center w-full max-w-lg text-center">

        <div class="flex items-center gap-2">
            <span class="text-xl">📍</span>

        </div>
    </div>



    <!-- Logo -->
    <div class="mt-8">
        <img src="../../../assets/logo_roues_libres.webp" alt="Logo Roues Libres"
