<ng-container>
    <h2 class="text-xl title font-bold legal-notice-section-title">
        {{title}}
    </h2>
    <div class="legal-notice-section-content px-4 py-2">
        <div class="text-sm text-white legal-notice-section-content-description">
            {{content}}
        </div>
        <a [href]="link" class="text-sm text-white legal-notice-section-content-link">{{linkText}}</a>
    </div>
</ng-container>
